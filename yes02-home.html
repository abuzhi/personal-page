<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盈视科技 一站式私域解决方案服务提供商</title>
    <link rel="shortcut icon" href="static/img/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #4F7CF7;
            --secondary-blue: #2E5BFF;
            --light-blue: #F0F4FF;
            --text-dark: #1A1D29;
            --text-light: #6B7280;
            --white: #FFFFFF;
            --gray-100: #F9FAFB;
            --gray-200: #E5E7EB;
            --gray-300: #D1D5DB;
            --border-radius: 12px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .main-content {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 60px;
            align-items: center;
        }

        /* Left Section - Content */
        .content-section {
            color: var(--white);
            padding: 40px 0;
        }

        .logo {
            display: flex;
            align-items: center;
            margin-bottom: 60px;
        }

         .logo-svg {
             width: 50px;
             height: 50px;
             margin-right: 12px;
             filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
         }

         .logo-icon {
             width: 40px;
             height: 40px;
             background: var(--white);
             border-radius: 8px;
             display: flex;
             align-items: center;
             justify-content: center;
             margin-right: 12px;
             font-weight: 700;
             color: var(--primary-blue);
             font-size: 18px;
         }

        .logo-text {
            font-size: 24px;
            font-weight: 600;
            color: var(--white);
        }

        .main-heading {
            font-size: 48px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sub-heading {
            font-size: 28px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 40px;
            color: rgba(255, 255, 255, 0.9);
        }

        .feature-highlight {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--border-radius);
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            color: var(--white);
            margin-bottom: 60px;
        }

        /* 3D Device Illustration */
        .device-illustration {
            position: relative;
            width: 100%;
            height: 400px;
            margin-top: 40px;
        }

        .device-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
        }

        .camera-device {
            position: absolute;
            width: 180px;
            height: 120px;
            background: linear-gradient(135deg, #4F7CF7 0%, #2E5BFF 100%);
            border-radius: 16px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(-15deg) rotateY(15deg);
            box-shadow: var(--shadow-xl);
        }

        .camera-lens {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #4F7CF7);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 4px solid rgba(255, 255, 255, 0.3);
        }

        .camera-lens::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, #1e40af, #1e3a8a);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .platform-base {
            position: absolute;
            width: 250px;
            height: 40px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            border-radius: 20px;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .floating-element {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--white);
            animation: floatAround 8s ease-in-out infinite;
        }

        .floating-element:nth-child(1) {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            top: 30%;
            right: 10%;
            animation-delay: 2s;
        }

        .floating-element:nth-child(3) {
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }

        .floating-element:nth-child(4) {
            bottom: 30%;
            right: 20%;
            animation-delay: 6s;
        }

        /* Right Section - Login Form */
        .login-section {
            background: var(--white);
            border-radius: 20px;
            padding: 48px 40px;
            box-shadow: var(--shadow-xl);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .welcome-text {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .welcome-subtext {
            font-size: 16px;
            color: var(--text-light);
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--gray-200);
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 400;
            color: var(--text-dark);
            background: var(--white);
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(79, 124, 247, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-light);
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-blue);
        }

        .checkbox-label {
            font-size: 14px;
            color: var(--text-dark);
            cursor: pointer;
        }

        .forgot-password {
            font-size: 14px;
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--secondary-blue) 100%);
            color: var(--white);
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-md);
            margin-bottom: 24px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .signup-link {
            text-align: center;
            font-size: 14px;
            color: var(--text-light);
        }

        .signup-link a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-align: center;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-align: center;
        }

        /* Animations */
        @keyframes float {
            0%, 100% {
                transform: translate(-50%, -50%) rotateX(-15deg) rotateY(15deg) translateY(0px);
            }
            50% {
                transform: translate(-50%, -50%) rotateX(-15deg) rotateY(15deg) translateY(-20px);
            }
        }

        @keyframes floatAround {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            25% {
                transform: translateY(-10px) rotate(2deg);
            }
            50% {
                transform: translateY(-5px) rotate(-1deg);
            }
            75% {
                transform: translateY(-15px) rotate(1deg);
            }
        }

        /* Responsive Design */
        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 40px;
                max-width: 500px;
            }

            .content-section {
                text-align: center;
                order: 2;
            }

            .login-section {
                order: 1;
            }

            .main-heading {
                font-size: 36px;
            }

            .sub-heading {
                font-size: 24px;
            }

            .device-illustration {
                height: 300px;
            }

            .device-container {
                width: 250px;
                height: 250px;
            }

            .camera-device {
                width: 150px;
                height: 100px;
            }

             .camera-lens {
                 width: 50px;
                 height: 50px;
             }

             .logo-svg {
                 width: 40px;
                 height: 40px;
             }
         }

        @media (max-width: 640px) {
            .container {
                padding: 10px;
            }

            .login-section {
                padding: 32px 24px;
            }

            .main-heading {
                font-size: 28px;
            }

            .sub-heading {
                font-size: 20px;
            }

            .welcome-text {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-content">
            <!-- Left Content Section -->
            <div class="content-section">
                <div class="logo">
                    <img src="static/img/yes-logo.png" alt="YES LIVE" class="logo-svg">
                    <div class="logo-text">盈视科技</div>
                </div>

                <h1 class="main-heading">专注微信生态的</h1>
                <h2 class="sub-heading">一站式私域解决方案服务提供商</h2>

                <div class="feature-highlight">
                    ✨ 一站式私域解决方案
                </div>

                <!-- 3D Device Illustration -->
                <div class="device-illustration">
                    <div class="device-container">
                        <div class="camera-device">
                            <div class="camera-lens"></div>
                        </div>
                        <div class="platform-base"></div>
                    </div>

                    <div class="floating-elements">
                        <div class="floating-element">📱 微信私域</div>
                        <div class="floating-element">💬 实时互动</div>
                        <div class="floating-element">📊 数据分析</div>
                    </div>
                </div>
            </div>

            <!-- Right Login Section -->
            <div class="login-section">
                <div class="login-header">
                    <h3 class="welcome-text">欢迎使用YES LIVE</h3>
                    <p class="welcome-subtext">请登录您的账户以继续</p>
                </div>

                <form class="login-form">
                    <div class="form-group">
                        <label class="form-label" for="phone">手机号码</label>
                        <input 
                            type="tel" 
                            id="phone" 
                            class="form-input" 
                            placeholder="请输入手机号"
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">密码</label>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="请输入密码"
                            required
                        />
                    </div>

                    <div class="login-options">
                        <div class="remember-me">
                            <input type="checkbox" id="remember" class="checkbox">
                            <label for="remember" class="checkbox-label">记住登录</label>
                        </div>
                        <a href="#" class="forgot-password">忘记密码？</a>
                    </div>

                    <button type="submit" class="login-button">登录</button>

                    <div class="signup-link">
                        还没有账户？<a href="#">免费注册</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="footer">
        Copyright © 2024 深圳盈视数科科技有限公司 | <a href="https://beian.miit.gov.cn/" target="_blank">粤ICP备2024289970号</a> | <a href="https://beian.miit.gov.cn/" target="_blank">粤ICP备2024289970号-2</a>
    </div>

    <script>
        // 简单的表单验证
        document.querySelector('.login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            
            if (!phone) {
                alert('请输入手机号码');
                return;
            }
            
            if (!password) {
                alert('请输入密码');
                return;
            }
            
            // 手机号简单验证
            const phoneRegex = /^1[3456789]\d{9}$/;
            if (!phoneRegex.test(phone)) {
                alert('请输入正确的手机号码');
                return;
            }
            
            // 这里可以添加实际的登录逻辑
            alert('登录功能演示 - 实际项目中这里会连接到后端API');
        });

        // 添加一些交互效果
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'translateY(-2px)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'translateY(0)';
            });
        });

        // 添加页面加载动画
        window.addEventListener('load', function() {
            document.body.style.opacity = '0';
            document.body.style.transform = 'translateY(20px)';
            document.body.style.transition = 'all 0.6s ease';
            
            setTimeout(() => {
                document.body.style.opacity = '1';
                document.body.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
