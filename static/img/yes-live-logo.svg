<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 蓝色三角形背景 -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F7CF7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C4FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 外层三角形轮廓 -->
  <path d="M100 20 L180 160 L20 160 Z" fill="url(#blueGradient)" stroke="none"/>
  
  <!-- 内部白色圆形区域 -->
  <circle cx="100" cy="120" r="55" fill="white"/>
  
  <!-- YES 文字 -->
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#4F7CF7" text-anchor="middle">YES</text>
  
  <!-- LIVE 文字 -->
  <text x="100" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#4F7CF7" text-anchor="middle" letter-spacing="3px">LIVE</text>
</svg>
