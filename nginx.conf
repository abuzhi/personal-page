# Nginx配置文件 - 静态网站部署
# 适用于个人导航页面项目

# 主配置文件
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;  # 替换为您的域名
    
    # 网站根目录 - 指向您的项目目录
    root /path/to/your/personal-page;  # 替换为实际的项目路径，例如：/var/www/personal-page
    
    # 默认首页文件
    index index.html index.htm;
    
    # 字符集设置
    charset utf-8;
    
    # 日志配置
    access_log /var/log/nginx/personal-page.access.log;
    error_log /var/log/nginx/personal-page.error.log;
    
    # 主页面配置
    location / {
        try_files $uri $uri/ /index.html;
        
        # 缓存控制
        location ~* \.(html|htm)$ {
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }
    }
    
    # 静态资源缓存配置
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        
        # 启用gzip压缩
        gzip_static on;
    }
    
    # 特殊文件处理
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        expires 1y;
    }
    
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
    
    # 安全配置
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 防止访问敏感文件
    location ~* \.(htaccess|htpasswd|ini|log|sh|sql|conf)$ {
        deny all;
    }
    
    # 错误页面配置
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# HTTPS配置 (推荐)
server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;  # 替换为您的域名
    
    # SSL证书配置
    ssl_certificate /path/to/your/certificate.crt;  # 替换为SSL证书路径
    ssl_certificate_key /path/to/your/private.key;  # 替换为私钥路径
    
    # SSL安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 网站根目录
    root /path/to/your/personal-page;  # 替换为实际的项目路径
    index index.html index.htm;
    
    # 字符集设置
    charset utf-8;
    
    # 日志配置
    access_log /var/log/nginx/personal-page-ssl.access.log;
    error_log /var/log/nginx/personal-page-ssl.error.log;
    
    # 主页面配置
    location / {
        try_files $uri $uri/ /index.html;
        
        # 安全头设置
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    
    # 静态资源缓存配置
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        gzip_static on;
    }
    
    # 特殊文件处理
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        expires 1y;
    }
    
    # 安全配置
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~* \.(htaccess|htpasswd|ini|log|sh|sql|conf)$ {
        deny all;
    }
    
    # 错误页面配置
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}

# HTTP重定向到HTTPS
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    return 301 https://$server_name$request_uri;
}
