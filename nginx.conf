# nn.sayai.top 正式配置，作为 http {} 内的站点配置加载。
# 安装到 /etc/nginx/conf.d/personal-page.conf，不要替换主 nginx.conf。
# 网站目录：/var/www/personal-page
# 首次部署先使用 nginx.http.conf 申请证书，步骤见 DEPLOY.md。

server {
    listen 80;
    server_name nn.sayai.top;

    # Let's Encrypt HTTP-01 验证及自动续期。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://nn.sayai.top$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name nn.sayai.top;

    root /var/www/personal-page;
    index index.html;
    charset utf-8;
    autoindex off;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/nn.sayai.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nn.sayai.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:personal_page_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/personal-page.access.log;
    error_log /var/log/nginx/personal-page.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 页面和脚本没有内容哈希；每次使用前向服务器验证更新。
    # 同样覆盖 manifest.json 和 service-worker.js。
    expires -1;
    etag on;

    # 隐藏 Git、编辑器等元数据，以及随项目上传的配置和文档。
    location ~ (^|/)\. {
        return 404;
    }

    location ~* \.(?:conf|md|ya?ml|log|bak|db)$ {
        return 404;
    }

    location ~* \.(?:debug|back)\.html$ {
        return 404;
    }

    location ~* \.(?:png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|otf)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # 纯静态站点：不存在的文件返回 404。
    location / {
        try_files $uri $uri/ =404;
    }
}
