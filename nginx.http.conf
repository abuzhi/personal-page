# 首次申请 HTTPS 证书时使用的临时站点配置。
# 安装到 /etc/nginx/conf.d/personal-page.conf。
# 证书签发成功后，用 nginx.conf 覆盖此配置，步骤见 DEPLOY.md。

server {
    listen 80;
    server_name nn.sayai.top;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
