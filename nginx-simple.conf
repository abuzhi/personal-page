# 简化版Nginx配置 - 快速部署静态网站
# 适用于个人导航页面项目

server {
    listen 80;
    server_name localhost;  # 本地测试或替换为您的域名
    
    # 网站根目录 - 请替换为您的实际项目路径
    root /var/www/personal-page;  # 例如：/home/user/personal-page 或 /var/www/html
    
    # 默认首页
    index index.html;
    
    # 主页面配置
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # 错误页面
    error_page 404 /404.html;
}
